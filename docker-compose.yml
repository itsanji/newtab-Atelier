services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: atelier
    volumes:
      - atelier-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelier -d atelier"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Always point at the bundled database, whatever .env says.
      DATABASE_URL: postgres://atelier:${POSTGRES_PASSWORD}@db:5432/atelier
      PORT: "8787"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8787}:8787"

volumes:
  atelier-db:
